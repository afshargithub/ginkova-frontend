<svg
    xmlns="http://www.w3.org/2000/svg"
    width="800"
    height="500"
    viewBox="0 0 800 500"
    role="img"
    aria-labelledby="title description"
>
    <title id="title">Meal placeholder</title>

    <desc id="description">
        Placeholder image for a meal without a photo
    </desc>

    <defs>
        <linearGradient
            id="background"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
        >
            <stop offset="0%" stop-color="#dcfce7" />
            <stop offset="100%" stop-color="#bbf7d0" />
        </linearGradient>
    </defs>

    <rect
        width="800"
        height="500"
        fill="url(#background)"
    />

    <circle
        cx="400"
        cy="230"
        r="120"
        fill="#ffffff"
        opacity="0.95"
    />

    <circle
        cx="400"
        cy="230"
        r="82"
        fill="#f0fdf4"
        stroke="#16a34a"
        stroke-width="10"
    />

    <path
        d="M350 225 C370 170 430 170 450 225 C425 275 375 275 350 225Z"
        fill="#22c55e"
    />

    <circle
        cx="380"
        cy="215"
        r="16"
        fill="#facc15"
    />

    <circle
        cx="420"
        cy="238"
        r="14"
        fill="#ef4444"
    />

    <path
        d="M285 150 L285 315"
        stroke="#15803d"
        stroke-width="14"
        stroke-linecap="round"
    />

    <path
        d="M515 150 L515 315"
        stroke="#15803d"
        stroke-width="14"
        stroke-linecap="round"
    />

    <text
        x="400"
        y="420"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="34"
        font-weight="700"
        fill="#166534"
    >
        GINKOVA
    </text>
</svg>