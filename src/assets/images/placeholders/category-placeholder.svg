<svg
    xmlns="http://www.w3.org/2000/svg"
    width="800"
    height="500"
    viewBox="0 0 800 500"
    role="img"
    aria-labelledby="title description"
>
    <title id="title">Meal category placeholder</title>

    <desc id="description">
        Placeholder image for a meal category
    </desc>

    <defs>
        <linearGradient
            id="background"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
        >
            <stop offset="0%" stop-color="#ecfdf5" />
            <stop offset="100%" stop-color="#d1fae5" />
        </linearGradient>
    </defs>

    <rect
        width="800"
        height="500"
        fill="url(#background)"
    />

    <path
        d="M220 310 C250 190 550 190 580 310Z"
        fill="#ffffff"
        stroke="#16a34a"
        stroke-width="12"
    />

    <path
        d="M270 290 C305 210 355 210 390 290Z"
        fill="#22c55e"
    />

    <path
        d="M360 290 C390 200 440 200 470 290Z"
        fill="#84cc16"
    />

    <path
        d="M440 290 C475 220 520 220 550 290Z"
        fill="#facc15"
    />

    <circle
        cx="330"
        cy="260"
        r="18"
        fill="#ef4444"
    />

    <circle
        cx="470"
        cy="258"
        r="16"
        fill="#f97316"
    />

    <text
        x="400"
        y="400"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="32"
        font-weight="700"
        fill="#166534"
    >
        Healthy Meal Category
    </text>
</svg>